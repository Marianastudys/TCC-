<app-navbar></app-navbar>

<div class="container">

    <h1 class="display-4 fw-bold text-warning bi bi-grid-fill">
        Jogo da Memória <i class="bi bi-grid-fill"></i>
    </h1>

    <div class="informacoes">

        <p class="lead fw-bold">
            Acertos: {{ acertos }}
        </p>

        <p class="lead fw-bold">
            Tentativas: {{ erros + acertos }}
        </p>

    </div>

    <div class="tabuleiro">

        @for (carta of cartas; track carta; let i = $index) {

        <button #cartaBotao [class]="
'carta' +

(carta.virada ? ' virada' : '') +

(carta.acertada ? ' acertada' : '') +

(indicesErrados.includes(i) ? ' errada' : '')
" (keydown)="moverFoco($event, i)" 
            (click)="virarCarta(carta)" [attr.aria-label]="carta.virada ? carta.conteudo : 'Carta virada para baixo'">

            {{ carta.virada ? carta.conteudo : '?' }}

        </button>

        }

    </div>

    @if (jogoFinalizado) {

    <div class="fim-jogo">

        <h2 class="display-6 fw-bold text-warning bi bi-award-fill">

            Você venceu! 

        </h2>

        <div class="botoes-finais">

            <button #botaoReiniciar class="botao-reiniciar fw-bold" (click)="reiniciarJogo()">
                Jogar novamente
            </button>

            <button #botaoSair class="botao-sair fw-bold" (click)="sairJogo()">
                Sair
            </button>

        </div>

    </div>
    }

</div>
