<app-navbar></app-navbar>

<div class="container">

    <div class="informacoes">

        <p class="lead fw-bold">
            Acertos: {{ acertos }}
        </p>

        <p class="lead fw-bold">
            Tentativas: {{ erros + acertos }}
        </p>

        <p class="lead fw-bold">
            Pontuação: {{ score }}
        </p>

    </div>

    <div class="tabuleiro">

        @for (carta of cartas; track carta; let i = $index) {

            <div class="carta-container">

                <button
                    #cartaBotao
                    [class]="
                        'carta' +
                        (carta.virada ? ' virada' : '') +
                        (carta.acertada ? ' acertada' : '') +
                        (indicesErrados.includes(i) ? ' errada' : '')
                    "
                    (keydown)="moverFoco($event, i)"
                    (click)="virarCarta(carta)"
                    [attr.aria-label]="
                        carta.virada
                        ? carta.conteudo
                        : 'Carta virada para baixo'
                    "
                >
                    {{ carta.virada ? carta.conteudo : '?' }}
                </button>

                @if (mostrarSaibaMais && carta === cartaSaibaMais) {

                    <app-saiba-mais
                        [titulo]="tituloSaibaMais"
                        [texto]="textoSaibaMais"
                        (continuar)="fecharSaibaMais()">
                    </app-saiba-mais>

                }

            </div>

        }

    </div>

    @if (jogoFinalizado) {

        <div class="fim-jogo">

            <h2 class="display-6 fw-bold text-warning bi bi-award-fill">
                Você venceu!
            </h2>

            <div class="botoes-finais">

                <button
                    #botaoReiniciar
                    class="botao-reiniciar fw-bold"
                    (click)="reiniciarJogo()"
                >
                    Jogar novamente
                </button>

                <button
                    #botaoSair
                    class="botao-sair fw-bold"
                    (click)="sairJogo()"
                >
                    Sair
                </button>

            </div>

        </div>

    }

</div>
