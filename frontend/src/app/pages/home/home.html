<app-navbar></app-navbar>

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold text-warning">
            Jogo da Memória
        </h1>

        <p class="lead fw-bold">
            Escolha um tema para começar
        </p>
    </div>

    <div class="row g-4 align-items-start">

<!-- Biologia Celular -->
<div class="col-md-4 tema-coluna">

    <div class="card shadow">

        <div class="card-body text-center">

            <h2 class="card-title fw-bold titulo-celular">
                Biologia Celular
            </h2>

            <div *ngFor="let jogo of jogosCitologia">

                <button
                    #botaoTema
                    (click)="selecionarTema(jogo.id)"
                    class="btnTop-celular fs-5 fw-bold">

                    {{ jogo.nome }}

                </button>

            </div>

        </div>

    </div>

    <!-- Painel de dificuldade -->
    <div
        *ngIf="temaSelecionado !== null && temaSelecionado === jogosCitologia[0]?.id"
        class="painel-dificuldade">

        <h3>
            Escolha a dificuldade
        </h3>

        <button
            #botaoDificuldade
            class="botao-dificuldade dificuldade-facil"
            (click)="iniciarJogo(jogosCitologia[0].id, 'facil')">

            <span>Fácil</span>
            <small>8 cartas</small>

        </button>

        <button
            #botaoDificuldade
            class="botao-dificuldade dificuldade-medio"
            (click)="iniciarJogo(jogosCitologia[0].id, 'medio')">

            <span>Médio</span>
            <small>12 cartas</small>

        </button>

        <button
            #botaoDificuldade
            class="botao-dificuldade dificuldade-dificil"
            (click)="iniciarJogo(jogosCitologia[0].id, 'dificil')">

            <span>Difícil</span>
            <small>16 cartas</small>

        </button>

    </div>

</div>
