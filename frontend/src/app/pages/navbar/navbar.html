 <nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container-fluid">

    <a
      class="navbar-brand"
      (click)="irHome()"
      (keydown.enter)="irHome()"
      (keydown.space)="$event.preventDefault(); irHome()"
      role="button"
      tabindex="0"
      aria-label="Jogo da Memória - página inicial">

      <span class="marca-icone" aria-hidden="true">✦</span>
      <span>Jogo da <strong>Memória!</strong></span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Abrir ou fechar menu">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      class="collapse navbar-collapse"
      id="navbarSupportedContent">

      <div class="navbar-acoes">

        @if (!usuarioLogado && mostrarBotaoEntrar) {
          <button
            class="botao-entrar"
            type="button"
            (click)="irLogin()">
            Entrar
            <span aria-hidden="true">➜</span>
          </button>
        }

        @if (nomeUsuario) {
          <button
            class="usuario-logado"
            type="button"
            (click)="irUsuario()"
            aria-label="Abrir perfil do usuário">

            <span class="icone-usuario" aria-hidden="true">👤</span>
            <span>Olá, {{ nomeUsuario }}!</span>
          </button>
        }

        @if (usuarioLogado) {
          <button
            class="botao-sair"
            type="button"
            (click)="logout()">
            Sair
          </button>
        }

        <div class="acessibilidade" aria-label="Opções de acessibilidade">

          <button
            type="button"
            class="botao-acessibilidade"
            (click)="diminuirFonte()"
            aria-label="Diminuir tamanho da fonte">
            Diminuir Fonte −
          </button>

          <button
            type="button"
            class="botao-acessibilidade"
            (click)="aumentarFonte()"
            aria-label="Aumentar tamanho da fonte">
            Aumentar Fonte +
          </button>

          <button
            type="button"
            class="botao-contraste"
            (click)="alternarTema()"
            aria-label="Alternar contraste">
            <span aria-hidden="true">☾</span>
            Contraste
          </button>

        </div>

      </div>
    </div>
  </div>
</nav>
